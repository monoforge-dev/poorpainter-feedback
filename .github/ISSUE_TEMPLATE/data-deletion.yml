name: Data deletion request / データの削除
description: Ask us to delete your data / データの削除の依頼
title: "Delete my data"
labels: ["data-deletion"]
body:
  - type: markdown
    attributes:
      value: |
        Open this issue from the GitHub account you used to log in to Poor Painter.
        Poor Painter にログインした GitHub アカウントで開いてください。
  - type: textarea
    id: what
    attributes:
      label: What to delete / 消してほしいもの
    validations:
      required: true
